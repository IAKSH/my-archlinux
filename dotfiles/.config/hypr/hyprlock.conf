general {
    ignore_empty_input = false
    hide_cursor = true
}

background {
    monitor = eDP-1
    path = /home/lain/misc/wallpaper/wallhaven-mlygyy_3840x2160.png
    blur_passes = 2          # 减少模糊层，提升性能
    brightness = 0.6         # 适当调暗，突出前景
}

# ---------- 状态提示 ----------
label {
    monitor = eDP-1
    text = (=^･ω･^=)
    color = rgba(ffffff88)   # 半透明白
    font_size = 16
    font_family = "Noto Sans"
    position = 0, 0
    halign = center
    valign = center
}

# ---------- 名言（自动截断） ----------
label {
    monitor = eDP-1
    #text = cmd[update: 60000] sh -c "fortune -s | fold -s -w 50 | head -n 3"
    text = cmd[] sh -c "fortune -s | fold -s -w 50 | head -n 3"
    color = rgba(ffffffdd)   # 高亮白
    font_size = 22
    font_family = "Noto Serif CJK SC"
    position = 0, 120
    halign = center
    valign = center
    # 可加上 text_align = center（默认居中）
}

# ---------- 密码输入框 ----------
input-field {
    monitor = eDP-1
    size = 360, 64
    outline_thickness = 3
    dots_size = 0.35
    dots_spacing = 0.3
    dots_center = true
    outer_color = rgba(33ccffee)
    inner_color = rgba(33ccff22)
    font_color = rgba(ffffffff)
    fade_on_empty = true
    placeholder_text = <i>输入密码解锁</i>
    position = 0, -120
    halign = center
    valign = center
}
